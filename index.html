<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EnferMétrica</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <!-- Icono para iPhone/iPad -->
    <link rel="apple-touch-icon" sizes="180x180" href="icono-180.png">
</head>

<body>

    <div class="calculadora">

        <h1>EnferMétrica</h1>

        <p class="subtitulo">Chile</p>

        <p>Tipo de evaluación</p>

        <div class="tipo-evaluación">

            <button
                type="button"
                onclick="seleccionarTipo('adulto')"
                id="btnAdulto"
                class="activo">
                Adulto
            </button>

            <button
                type="button"
                onclick="seleccionarTipo('adultoMayor')"
                id="btnAdultoMayor">
                Persona mayor
            </button>

            <button
                type="button"
                onclick="seleccionarTipo('pediatrico')"
                id="btnPediatrico">
                NNA
            </button>

        </div>


        <form onsubmit="calcularIMC(); return false;">

            <!-- ========================= -->
            <!-- CAMPOS ADULTO -->
            <!-- ========================= -->

            <div id="camposAdulto">

                <label>Peso (kg)</label>

                <input
                    type="number"
                    id="peso"
                    step="0.01"
                    min="1"
                    max="500">

                <br><br>

                <label>Altura (m)</label>

                <input
                    type="number"
                    id="altura"
                    step="0.01"
                    min="0.5"
                    max="2.5">

            </div>


            <!-- ========================= -->
            <!-- CAMPOS PEDIÁTRICOS -->
            <!-- ========================= -->

            <div id="camposPediatricos" style="display: none;">

                <label>Sexo</label>

                <select id="sexo">

                    <option value="">Seleccionar</option>

                    <option value="nino">Niño</option>

                    <option value="nina">Niña</option>

                </select>

                <br><br>


                <label>Edad</label>

                <div class="edad">

                    <div>
                        <input
                            type="number"
                            id="anios"
                            min="0"
                            max="19"
                            placeholder="Años">
                    </div>

                    <div>
                        <input
                            type="number"
                            id="meses"
                            min="0"
                            max="11"
                            placeholder="Meses">
                    </div>

                </div>

                <br>


                <label>Peso (kg)</label>

                <input
                    type="number"
                    id="pesoPediatrico"
                    step="0.01"
                    min="0.1"
                    max="150">

                <br><br>


                <label>Talla / longitud (cm)</label>

                <input
                    type="number"
                    id="talla"
                    step="0.1"
                    min="20"
                    max="220">

                <br><br>


                <!-- IMC -->
                <label>IMC</label>

                <input
                    type="text"
                    id="imcPediatrico"
                    placeholder="Se calculará automáticamente"
                    readonly>

                <br><br>


                <!-- PERÍMETRO DE CINTURA -->
                <label>Perímetro de cintura (cm)</label>

                <input
                    type="number"
                    id="cintura"
                    step="0.1"
                    min="10"
                    max="150">

                <br><br>


                <!-- PERÍMETRO CRANEAL -->
                <label>Perímetro craneal (cm)</label>

                <input
                    type="number"
                    id="perimetroCraneal"
                    step="0.1"
                    min="20"
                    max="70">

            </div>


            <br>

            <button type="submit" id="botonCalcular">
                Calcular IMC
            </button>

        </form>


        <!-- ========================= -->
        <!-- RESULTADO -->
        <!-- ========================= -->

        <div class="resultado">

            <p class="titulo-resultado">Resultado</p>

            <p id="resultado">--</p>

            <p id="categoria">Ingresa tus datos</p>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
