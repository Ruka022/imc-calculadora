<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora IMC</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <!-- Icono para iPhone/iPad -->
    <link rel="apple-touch-icon" sizes="180x180" href="icono-180.png">
</head>

<body>

    <div class="calculadora">

            <h1>Calculadora de IMC</h1>
            <p class="subtitulo">Chile</p>

            <p>Tipo de evaluación</p>

            <div class="tipo-evaluación">
                <button type="button" onclick="seleccionarTipo('adulto')" id="btnAdulto" class="activo">Adulto
                </button>

                <button type="button" onclick="seleccionarTipo('adultoMayor')" id="btnAdultoMayor">Adulto mayor
                </button>

            </div>

            <form onsubmit="calcularIMC(); return false;">

                <label>Peso (kg)</label>
                <input type="number" id="peso" step="0.01" min="1" max="500"> 

                <br><br>

                <label>Altura (m)</label>
                <input type="number" id="altura" step="0.01" min="0.5" max="2.5">

                <br><br>

                <button>Calcular IMC</button>

            </form>

            <div class="resultado">

                <p class="titulo-resultado">Tu IMC</p>
                <p id="resultado">--</p>
                <p id="categoria">Ingresa tus datos</p>

            </div>

    </div>            
    <script src="script.js"></script>
</body>
</html>
